<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
  <title id="title">extract_data_agent Loop State Machine</title>
  <desc id="desc">Planner owns planned steps, critic approves or replans before and after tool execution, then loop or end.</desc>

  <defs>
    <marker id="arrow" markerWidth="4.48" markerHeight="3.36" refX="3.92" refY="1.68" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L4.48,1.68 L0,3.36 z" fill="#0e2a3f"/>
    </marker>
    <marker id="arrow_replan" markerWidth="4.48" markerHeight="3.36" refX="3.92" refY="1.68" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L4.48,1.68 L0,3.36 z" fill="#b33a2b"/>
    </marker>
    <style>
      .title { font: 700 52px Arial, sans-serif; fill: #132a3a; }
      .sub { font: 400 24px Arial, sans-serif; fill: #395467; }
      .node-title { font: 700 30px Arial, sans-serif; fill: #102638; }
      .node-text { font: 400 20px Arial, sans-serif; fill: #1e435c; }
      .edge-text { font: 700 22px Arial, sans-serif; fill: #0e2a3f; }
      .replan-text { font: 700 22px Arial, sans-serif; fill: #b33a2b; }
      .small { font: 700 18px Arial, sans-serif; fill: #17364d; }
      .tele-title { font: 700 30px Arial, sans-serif; fill: #4b5560; }
      .tele-text { font: 400 20px Arial, sans-serif; fill: #5f6872; }
      .edge { stroke: #0e2a3f; stroke-width: 8; stroke-linecap: round; fill: none; marker-end: url(#arrow); }
      .replan { stroke: #b33a2b; stroke-width: 8; stroke-linecap: round; fill: none; marker-end: url(#arrow_replan); }
      .obs { stroke: #2d845f; stroke-width: 6; stroke-linecap: round; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="2400" height="1500" fill="#f5f2ea"/>
  <rect x="30" y="30" width="2340" height="1440" rx="22" fill="#fffdf8" stroke="#d6cdbb" stroke-width="3"/>

  <text x="90" y="112" class="title">extract_data_agent Workflow Loop</text>
  <text x="90" y="150" class="sub">planner stores steps, critic gates execution in pre/post phases, then continue or end</text>

  <rect x="180" y="357" width="2060" height="80" rx="20" fill="#eceff1" stroke="#8a949e" stroke-width="4" stroke-dasharray="12 10"/>
  <text x="250" y="391" class="tele-title">telemetry (observer)</text>
  <text x="700" y="419" class="tele-text">logs decisions, transitions, tool outputs, and errors</text>

  <circle cx="400" cy="1180" r="8" fill="#0e2a3f"/>
  <text x="416" y="1186" class="small">START</text>

  <rect x="140" y="620" width="520" height="250" rx="22" fill="#dfeefe" stroke="#6f94b8" stroke-width="4"/>
  <text x="170" y="690" class="node-title">planner (LLM)</text>
  <text x="170" y="725" class="node-text">creates/repairs planned_steps[]</text>
  <text x="170" y="755" class="node-text">selects next_step by current_step_index</text>
  <text x="170" y="785" class="node-text">sets critic_phase=pre, workflow_status=critic</text>

  <rect x="980" y="620" width="520" height="250" rx="22" fill="#f8e0cc" stroke="#cc9455" stroke-width="4"/>
  <text x="1010" y="690" class="node-title">critic (LLM)</text>
  <text x="1010" y="725" class="node-text">pre: approve execute or request replan</text>
  <text x="1010" y="755" class="node-text">post: approve continue or request replan</text>
  <text x="1010" y="785" class="node-text">writes workflow_status</text>

  <rect x="1840" y="640" width="500" height="210" rx="22" fill="#f8dfe4" stroke="#bf7485" stroke-width="4"/>
  <text x="1870" y="700" class="node-title">tool_executor</text>
  <text x="1870" y="735" class="node-text">executes one selected step</text>
  <text x="1870" y="765" class="node-text">sets critic_phase=post, returns to critic</text>

  <circle cx="1240" cy="1180" r="8" fill="#0e2a3f"/>
  <text x="1256" y="1186" class="small">END</text>

  <path d="M400 1172 L400 870" class="edge"/>

  <path d="M660 744 L980 744" class="edge"/>
  <text x="820" y="720" class="edge-text" text-anchor="middle">planner -> critic (pre)</text>

  <path d="M1500 710 L1840 710" class="edge"/>
  <text x="1670" y="685" class="edge-text" text-anchor="middle">pre approve -> execute</text>

  <path d="M980 786 L660 786" class="replan"/>
  <text x="820" y="818" class="replan-text" text-anchor="middle">pre replan -> planner</text>

  <path d="M1840 760 L1500 760" class="edge"/>
  <text x="1670" y="790" class="edge-text" text-anchor="middle">tool_executor -> critic (post)</text>

  <path d="M1240 870 L1240 930 L520 930 L520 870" class="edge"/>
  <text x="880" y="918" class="edge-text" text-anchor="middle">post approve -> planner (next step)</text>

  <path d="M1240 870 L1240 980 L480 980 L480 870" class="replan"/>
  <text x="860" y="968" class="replan-text" text-anchor="middle">post replan -> planner (reset plan)</text>

  <path d="M1240 870 L1240 1168" class="edge"/>
  <text x="1240" y="1030" class="edge-text" text-anchor="middle">complete / else</text>

  <path d="M400 620 L400 437" class="obs"/>
  <path d="M1240 620 L1240 437" class="obs"/>
  <path d="M2090 640 L2090 437" class="obs"/>
  <text x="440" y="529" class="tele-text" text-anchor="middle" dominant-baseline="middle">observe</text>
  <text x="1280" y="529" class="tele-text" text-anchor="middle" dominant-baseline="middle">observe</text>
  <text x="2130" y="539" class="tele-text" text-anchor="middle" dominant-baseline="middle">observe</text>
</svg>
